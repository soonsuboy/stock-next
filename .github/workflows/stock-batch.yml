name: Stock Data Batch

on:
  schedule:
    # Poll DB-backed schedule settings every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "companies, index_universe, kr, us, watchlist_prices, teacher_watchlist_prices, metric_prices, macro, telegram_dialogs, telegram_collect, telegram_summarize, or all"
        required: true
        default: "all"
        type: choice
        options:
          - companies
          - index_universe
          - kr
          - us
          - watchlist_prices
          - teacher_watchlist_prices
          - metric_prices
          - macro
          - telegram_dialogs
          - telegram_collect
          - telegram_summarize
          - all
      shard_index:
        description: "US shard index"
        required: false
        default: "0"
      shard_count:
        description: "US shard count"
        required: false
        default: "7"
      limit:
        description: "Optional per-run company limit"
        required: false
        default: ""
      codes:
        description: "Optional comma-separated codes for metrics runs"
        required: false
        default: ""
      selection:
        description: "Metric selection: all, missing, existing, or incomplete"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - missing
          - existing
          - incomplete
      price_market:
        description: "Price refresh market for metric_prices: ALL, KR, or US"
        required: false
        default: "ALL"
        type: choice
        options:
          - ALL
          - KR
          - US
      request_id:
        description: "Optional pre-created batch_runs id"
        required: false
        default: ""
      telegram_date:
        description: "Optional YYYY-MM-DD date for telegram_summarize"
        required: false
        default: ""
      telegram_backfill:
        description: "For telegram_collect, re-read recent messages even if last_message_id is already advanced"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Fetch and print without writing to Turso"
        required: false
        default: false
        type: boolean

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ENV: ${{ vars.KIS_ENV }}
      KIS_BASE_URL: ${{ vars.KIS_BASE_URL }}
      KIS_REQUEST_DELAY_SECONDS: ${{ vars.KIS_REQUEST_DELAY_SECONDS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ensure DB schema
        run: python batch/migrate_db.py

      - name: Run scheduled batch
        if: github.event_name == 'schedule'
        run: python batch/run_scheduled.py

      - name: Run scheduled telegram sync
        if: github.event_name == 'schedule'
        run: python batch/telegram_sync.py --mode scheduled

      - name: Run manual batch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          shard_index="${{ inputs.shard_index }}"
          shard_count="${{ inputs.shard_count }}"
          limit="${{ inputs.limit }}"
          codes="${{ inputs.codes }}"
          selection="${{ inputs.selection }}"
          price_market="${{ inputs.price_market }}"
          request_id="${{ inputs.request_id }}"
          telegram_date="${{ inputs.telegram_date }}"
          telegram_backfill="${{ inputs.telegram_backfill }}"
          dry_run="${{ inputs.dry_run }}"

          company_extra=()
          metric_extra=()
          price_extra=()
          if [ -n "$limit" ]; then
            company_extra+=(--limit "$limit")
            metric_extra+=(--limit "$limit")
            price_extra+=(--limit "$limit")
          fi
          if [ -n "$codes" ]; then
            metric_extra+=(--codes "$codes")
          fi
          if [ -n "$selection" ]; then
            metric_extra+=(--selection "$selection")
          fi
          if [ -n "$request_id" ]; then
            metric_extra+=(--run-id "$request_id")
            price_extra+=(--run-id "$request_id")
          fi
          if [ "$dry_run" = "true" ]; then
            company_extra+=(--dry-run)
            metric_extra+=(--dry-run)
            price_extra+=(--dry-run)
          fi

          if [ "$mode" = "companies" ] || [ "$mode" = "all" ]; then
            python batch/update_companies.py --market ALL "${company_extra[@]}"
          fi
          if [ "$mode" = "index_universe" ]; then
            index_extra=(--collect-metrics --selection "$selection" --us-shard-index "$shard_index" --us-shard-count "$shard_count")
            if [ -n "$limit" ]; then
              index_extra+=(--limit "$limit")
            fi
            if [ -n "$request_id" ]; then
              index_extra+=(--run-id "$request_id")
            fi
            if [ "$dry_run" = "true" ]; then
              index_extra+=(--dry-run)
            fi
            python batch/update_index_universe.py --index ALL "${index_extra[@]}"
          fi
          if [ "$mode" = "kr" ] || [ "$mode" = "all" ]; then
            python batch/update_metrics.py --market KR "${metric_extra[@]}"
          fi
          if [ "$mode" = "us" ] || [ "$mode" = "all" ]; then
            python batch/update_metrics.py --market US --shard-index "$shard_index" --shard-count "$shard_count" "${metric_extra[@]}"
          fi
          if [ "$mode" = "watchlist_prices" ] || [ "$mode" = "all" ]; then
            python batch/update_watchlist_prices.py --market ALL "${price_extra[@]}"
          fi
          if [ "$mode" = "teacher_watchlist_prices" ] || [ "$mode" = "all" ]; then
            python batch/update_watchlist_prices.py --scope teacher --market ALL "${price_extra[@]}"
          fi
          if [ "$mode" = "metric_prices" ]; then
            python batch/update_watchlist_prices.py --scope metrics --market "$price_market" "${price_extra[@]}"
          fi
          if [ "$mode" = "macro" ] || [ "$mode" = "all" ]; then
            python batch/update_macro_indicators.py
          fi
          if [ "$mode" = "telegram_dialogs" ]; then
            telegram_extra=()
            if [ -n "$request_id" ]; then
              telegram_extra+=(--run-id "$request_id")
            fi
            python batch/telegram_sync.py --mode dialogs "${telegram_extra[@]}"
          fi
          if [ "$mode" = "telegram_collect" ]; then
            telegram_extra=(--summarize)
            if [ -n "$request_id" ]; then
              telegram_extra+=(--run-id "$request_id")
            fi
            if [ "$telegram_backfill" = "true" ]; then
              telegram_extra+=(--backfill)
            fi
            python batch/telegram_sync.py --mode collect "${telegram_extra[@]}"
          fi
          if [ "$mode" = "telegram_summarize" ]; then
            telegram_extra=()
            if [ -n "$request_id" ]; then
              telegram_extra+=(--run-id "$request_id")
            fi
            if [ -n "$telegram_date" ]; then
              telegram_extra+=(--date "$telegram_date")
            fi
            python batch/telegram_sync.py --mode summarize "${telegram_extra[@]}"
          fi
